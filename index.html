<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <!-- Favicon: 3×3 grid SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 90'%3E%3Crect width='90' height='90' rx='6' fill='%23fff'/%3E%3Crect x='4' y='4' width='82' height='82' rx='4' fill='none' stroke='%231a1a1a' stroke-width='9.5'/%3E%3Cline x1='31' y1='4' x2='31' y2='86' stroke='%231a1a1a' stroke-width='4.5'/%3E%3Cline x1='59' y1='4' x2='59' y2='86' stroke='%231a1a1a' stroke-width='4.5'/%3E%3Cline x1='4' y1='31' x2='86' y2='31' stroke='%231a1a1a' stroke-width='4.5'/%3E%3Cline x1='4' y1='59' x2='86' y2='59' stroke='%231a1a1a' stroke-width='4.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1 class="logo">
      <!-- 3×3 grid icon -->
      <svg class="logo-icon" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="82" height="82" rx="4" fill="none" stroke="currentColor" stroke-width="9.5"/>
        <line x1="31" y1="4"  x2="31" y2="86" stroke="currentColor" stroke-width="4.5"/>
        <line x1="59" y1="4"  x2="59" y2="86" stroke="currentColor" stroke-width="4.5"/>
        <line x1="4"  y1="31" x2="86" y2="31" stroke="currentColor" stroke-width="4.5"/>
        <line x1="4"  y1="59" x2="86" y2="59" stroke="currentColor" stroke-width="4.5"/>
      </svg>
      Sudoku
    </h1>
    <div class="header-right">
      <span class="timer" id="timer">00:00</span>
      <button id="themeBtn" onclick="toggleTheme()">Dark</button>
    </div>
  </header>

  <!-- Difficulty + Meta -->
  <div class="controls">
    <div class="diff-tabs">
      <button class="diff-btn active" data-diff="easy"   onclick="setDifficulty(this)">Easy</button>
      <button class="diff-btn"        data-diff="medium" onclick="setDifficulty(this)">Medium</button>
      <button class="diff-btn"        data-diff="hard"   onclick="setDifficulty(this)">Hard</button>
    </div>
    <div class="meta">
      <span>Mistakes <b id="mistakeCnt">0</b>/5</span>
      <span>Hints <b id="hintCnt">5</b></span>
    </div>
  </div>

  <!-- Board + Numpad + Actions -->
  <div class="board-wrap">
    <div class="board" id="board"></div>

    <div class="numpad" id="numpad"></div>

    <div class="actions">
      <button onclick="newGame()">New Game</button>
      <button onclick="undoMove()">Undo</button>
      <button id="noteBtn" onclick="toggleNoteMode()">Note</button>
      <button onclick="hintMove()">Hint</button>
    </div>
  </div>

  <!-- Result overlay -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-time"  id="resultTime"></div>
      <div class="result-sub"   id="resultSub"></div>
      <button onclick="closeOverlay(); newGame()">Play Again</button>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
